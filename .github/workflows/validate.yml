name: Validate LSE6 web surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lse6-web-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate complete sitemap inventory and IndexNow contract
        run: python -m unittest tools/test_submit_indexnow.py
      - name: Validate LSE6.org bridge ownership and coverage
        run: python tools/validate_lse6_org_bridge.py
      - name: Validate inline JavaScript
        run: python tools/validate_inline_js.py
      - name: Parse every sitemap XML
        run: python -c "import xml.etree.ElementTree as ET; [ET.parse(x) for x in ('sitemap.xml','sitemap-images.xml','sitemap-video.xml','sitemap-lse6-org.xml')]; print('ALL SITEMAPS XML OK')"

  notify-indexnow:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Submit complete public sitemap inventory to IndexNow
        run: python tools/submit_indexnow.py --all
